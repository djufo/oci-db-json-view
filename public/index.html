<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DB Viewer</title>
    <link rel="stylesheet" href="styles.css?v=1" />
  </head>
  <body>
    <!-- Login (only when DBVIEW_PASSWORD is set) -->
    <div id="login" class="login hidden">
      <form id="loginForm" class="login-card">
        <div class="brand-mark">DB</div>
        <h1>Database Viewer</h1>
        <p class="muted">Read-only browser for the Oracle schema.</p>
        <input id="pw" type="password" placeholder="Access password" autocomplete="current-password" />
        <button class="btn btn-primary" type="submit">Sign in</button>
        <p id="loginError" class="err"></p>
      </form>
    </div>

    <!-- App -->
    <div id="app" class="app hidden">
      <header id="topbar">
        <div class="brand"><span class="brand-mark sm">DB</span><strong>Database Viewer</strong>
          <span class="pill ro">read-only</span></div>
        <span id="schema" class="muted"></span>
        <div class="spacer"></div>
        <button id="logout" class="btn btn-ghost hidden">Sign out</button>
      </header>

      <div class="layout">
        <aside class="sidebar">
          <input id="tableFilter" class="search" type="search" placeholder="Filter tables…" />
          <div id="tableList" class="table-list"></div>
        </aside>

        <main class="content">
          <div id="empty" class="empty"><h2>Pick a table</h2><p>Select a table on the left to browse its rows.</p></div>

          <section id="tableView" class="hidden">
            <div class="tv-head">
              <h2 id="tvName"></h2>
              <span id="tvCount" class="muted"></span>
              <div class="spacer"></div>
              <label class="muted">Rows/page
                <select id="pageSize"><option>25</option><option selected>50</option><option>100</option><option>200</option></select>
              </label>
              <div class="pager">
                <button id="prev" class="btn btn-sm">‹</button>
                <span id="pageInfo" class="muted"></span>
                <button id="next" class="btn btn-sm">›</button>
              </div>
              <button id="reload" class="btn btn-sm" title="Reload">↻</button>
            </div>
            <div class="grid-wrap">
              <table id="grid" class="grid"></table>
            </div>
          </section>
        </main>
      </div>
    </div>

    <!-- Cell / row detail viewer -->
    <dialog id="cellDialog" class="dlg">
      <div class="dlg-head">
        <strong id="cellTitle">Value</strong>
        <div class="dlg-actions">
          <button id="jvExpand" class="btn btn-sm hidden">Expand all</button>
          <button id="jvCollapse" class="btn btn-sm hidden">Collapse all</button>
          <button id="cellCopy" class="btn btn-sm">Copy</button>
          <button id="cellClose" class="btn btn-ghost">✕</button>
        </div>
      </div>
      <div id="cellBody" class="dlg-body"></div>
    </dialog>

    <script src="jsonview.js?v=1"></script>
    <script src="app.js?v=1"></script>
  </body>
</html>
